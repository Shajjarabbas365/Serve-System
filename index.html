<!DOCTYPE html>
<html>
<head>
  <base href="/Serve-System/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ServeSmart - restaurant audits, staff training and attendance.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ServeSmart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ServeSmart</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const b = document.createElement('button');
      b.textContent = 'Install ServeSmart';
      b.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:99999;padding:12px 18px;background:#16A34A;color:#fff;border:0;border-radius:12px;font:600 15px Arial;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer';
      b.onclick = async () => {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        b.remove();
        deferredPrompt = null;
      };
      document.body.appendChild(b);
    });
  </script>
</body>
</html>
